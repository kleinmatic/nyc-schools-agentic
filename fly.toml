# Fly.io app config. Update `app` to whatever name you actually got from
# `fly apps create` (nycschools may be taken; `nyc-schools-agentic` etc.
# are fallbacks).
app = "nycschools"
primary_region = "ewr"   # Newark, NJ — closest to NYC

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on single machine. Demo-grade reliability without the cost of
  # rolling-deploy redundancy. ~$31/mo at performance-1x + 2GB.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "performance-1x"   # Dedicated 1 vCPU + 2GB. shared-cpu-1x's 6.25%
                            # baseline throttled pandas-heavy cold-start to
                            # ~230s, flapping healthchecks. Dedicated vCPU
                            # restores local-class performance (~10-15s
                            # cold start). warm_caches() also runs off the
                            # lifespan critical path now — see main.py.
  memory = "2gb"
