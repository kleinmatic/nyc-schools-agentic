services:
  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      # Mount data/ read-only so the container tracks the on-disk SQLite +
      # geo files without rebuilding the image. The app only reads from
      # data/ at runtime; build_db.py writes to it but you run that on
      # the host, not in this container. Without this mount the running
      # code (hot-mounted via ./app) and the image's baked-in SQLite can
      # drift, which silently breaks lifespan on the next data-schema
      # change.
      - ./data:/app/data:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--reload"]
